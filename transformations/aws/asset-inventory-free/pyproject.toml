[project]
name = "aws-asset-inventory-free"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "dbt-postgres==1.11.0",
    "dbt-snowflake==1.12.0",
    "dbt-bigquery==1.12.0",
    "dbt-clickhouse==1.10.2",
    "dbt-core==1.12.3",
]

[tool.uv]
exclude-newer = "1 week"

# dbt-clickhouse caps dbt-adapters below what the other dbt packages require, so
# we override it. Raise the lower bound when a dbt upgrade needs a newer adapter.
override-dependencies = [
    "dbt-adapters>=1.24.5,<2.0",
]
